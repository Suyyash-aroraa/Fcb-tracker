name: Scrape FC Barcelona data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      # SofaScore needs Scrapling's stealth browser and usually a residential proxy.
      - if: env.SCRAPER_PROXY != ''
        run: scrapling install
      - name: Scrape and push to the Worker
        working-directory: scraper
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -n "$SCRAPER_PROXY" ]; then
            python -m fcb_scraper --push "$WORKER_URL"
          else
            python -m fcb_scraper --push "$WORKER_URL" --skip sofascore
          fi
