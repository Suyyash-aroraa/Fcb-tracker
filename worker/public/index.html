<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCB Tracker</title>
  <meta name="description" content="FC Barcelona fixtures, results, lineups, match stats, squad and table. Scraped from ESPN, SofaScore and Google News.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" href="https://a.espncdn.com/i/teamlogos/soccer/500/83.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://a.espncdn.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { var t = localStorage.getItem("fcb-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="FCB Tracker home">
        <img src="https://a.espncdn.com/i/teamlogos/soccer/500/83.png" alt="" width="32" height="32">
        <span class="brand-name">FCB <span>Tracker</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/matches" data-nav="matches">Matches</a>
        <a href="#/squad" data-nav="squad">Squad</a>
        <a href="#/table" data-nav="table">Table</a>
        <a href="#/news" data-nav="news">News</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme">
        <i class="ph ph-moon" aria-hidden="true"></i>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer id="footer"></footer>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
